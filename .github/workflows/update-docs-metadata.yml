name: Update documentation metadata

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: update-docs-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to the latest branch revision
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Test metadata updater
        run: python3 -B tests/test_update_docs_metadata.py

      - name: Refresh version and documentation metadata
        run: python3 tools/update_docs_metadata.py --prepare-commit

      - name: Commit metadata updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/variables.xml src/vscp/common/version.h
          # The version includes this commit even if the files already match.
          git commit --allow-empty -m "Update version and documentation metadata [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"